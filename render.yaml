services:
  - type: web
    name: skillnest-app
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PORT
        value: 3000
      - key: HOST
        value: 0.0.0.0
    disk:
      name: skillnest-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
